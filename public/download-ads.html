<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download advertisements</title><style>html,body{margin:0;width:100%;height:100%}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow-x:hidden;overflow-y:auto}#banner{width:160px;height:300px;max-height:100%;flex:none}#banner:empty{display:none}.mnd{width:100%;max-width:340px;display:flex;justify-content:center;flex:none}iframe{max-width:100%;max-height:100%}</style></head><body><div id="banner"></div><script>
// Mondiad (banner / native / in-page push): element divs first, then Mondiad's own delivery scripts.
// Its codes can arrive a moment after the Adsterra ones, so each element/script is added once when it first arrives.
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const MND=['mrmnd.com','mndsrv.com','mondiad.com','mondiad.net','mondiad.digital'];
const isMnd=(h)=>MND.some((d)=>h===d||h.endsWith('.'+d));
const mndDone=new Set();
function loadMondiad(list) {
  for(const part of Array.isArray(list)?list:[]) {
    const box=document.createElement('div'); box.className='mnd';
    for(const el of Array.isArray(part?.elements)?part.elements:[]) {
      if(!/^data-mnd(banid|azid)$/.test(String(el?.attr)) || !UUID.test(String(el?.id)) || mndDone.has(el.attr+el.id)) continue;
      mndDone.add(el.attr+el.id);
      const d=document.createElement('div'); d.setAttribute(el.attr,el.id); box.appendChild(d);
    }
    if(box.childNodes.length) document.body.appendChild(box);
    for(const sc of Array.isArray(part?.scripts)?part.scripts:[]) {
      let url; try { url=new URL(String(sc?.src)); } catch { continue; }
      if(url.protocol!=='https:' || !isMnd(url.hostname) || mndDone.has(url.href)) continue;
      mndDone.add(url.href);
      const script=document.createElement('script'); script.src=url.href; script.async=true;
      document.body.appendChild(script);
    }
  }
}
window.addEventListener('message', (event) => {
  if(event.origin !== location.origin || event.source !== parent || event.data?.type !== 'download-placements') return;
  const {banner,socialBar,mondiad}=event.data;
  loadMondiad(mondiad);
  if(document.body.dataset.loaded) return;
  document.body.dataset.loaded='true';
  // Only the administrator's supplied provider scripts execute in this disposable document.
  function load(snippet,container) {
    const doc=new DOMParser().parseFromString(String(snippet||''),'text/html');
    for(const source of doc.querySelectorAll('script')) {
      if(!source.src) continue;
      const url=new URL(source.src);
      if(url.protocol!=='https:' || url.hostname!=='bauval.org') continue;
      const script=document.createElement('script');
      script.src=url.href; script.async=false;
      script.setAttribute('data-cfasync','false'); container.appendChild(script);
    }
  }
  const key=String(banner||'').match(/['"]key['"]\s*:\s*['"]([a-f0-9]+)['"]/i)?.[1];
  if(key) window.atOptions={key,format:'iframe',height:300,width:160,params:{}};
  load(banner,document.getElementById('banner'));
  load(socialBar,document.body);
});
parent.postMessage({type:'download-ads-ready'},location.origin);
</script></body></html>
